version: "3.7"
services:
  dev-postgres:
    container_name: dev-postgres
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "A123456!"
    ports:
      - "5432:5432"
    volumes: 
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/dev/postgres/data'