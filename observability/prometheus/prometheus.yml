global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "nexus-hub"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"
  - job_name: "nexus-tenant"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"
