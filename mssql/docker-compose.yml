version: "3.7"
services:
  mssql:
    container_name: mssql
    image: mcr.microsoft.com/mssql/server:latest
    environment:
      - MSSQL_PID=Developer
      - ACCEPT_EULA=Y
      - SA_PASSWORD=A123456!
    ports:
      - 1433:1433
    volumes: 
      - mssql-data:/var/opt/mssql/data
      - mssql-backups:/var/backups
volumes:
  mssql-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/dev/sql/data'
  mssql-backups:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/dev/sql/backups'