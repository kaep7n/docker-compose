version: "3.7"
services:
  dev-timescale-db:
    container_name: dev-timescale-db
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "A123456!"
    ports:
      - "5432:5432"
    volumes: 
      - timescale-db-data:/var/lib/postgresql/data
volumes:
  timescale-db-data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/dev/timescale/data'